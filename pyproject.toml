[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dgflow-lab"
version = "0.1.0"
description = "Decentralized functional-encryption federated learning competition system"
requires-python = ">=3.11"
dependencies = ["py-arkworks-bls12381==0.5.0", "numpy>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "cryptography>=44", "pyyaml>=6", "python-multipart>=0.0.20", "psutil>=6", "packaging>=24", "tensorboard>=2.21,<2.22"]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]
train = ["torch>=2.5", "torchvision>=0.20"]
gpu = ["nvidia-cuda-nvrtc-cu12>=12.9,<13"]

[project.scripts]
dgflow = "dgfl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dgfl.crypto" = ["cuda/*.cuh"]
"dgfl.services" = ["assets/*.js", "assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# Scratch, build and packaging trees are not part of the shipped source.
extend-exclude = ["native", "tmp", "offline", "docs", "runtime", "runtime-*", "dist", "web"]

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The codebase deliberately writes `a=1;b=2` on one line for dense numeric
    # code. Enforcing E701/E702 would rewrite hundreds of lines of reviewed
    # cryptographic logic for no correctness gain.
    "E701", "E702",
    # Closures over loop variables are always invoked before the enclosing call
    # returns (see RunManager.combine_and_confirm), so late binding is not
    # observable. Verified directly rather than assumed.
    "B023",
    # `zip(..., strict=...)` is an explicitness preference; adding it here would
    # be noise rather than a fix.
    "B905",
    # `dict(...)` reads better than a literal where the call mirrors a signature.
    "C408",
    # Full-width CJK punctuation is required inside Chinese error messages.
    "RUF001", "RUF002", "RUF003",
    # EncodedMessage / ChunkAssembler own their spool file for the object's
    # lifetime and close it in close(); a `with` block would be wrong there.
    "SIM115",
    # The suggested ternary for Deployment's node-marker check is materially
    # harder to read than the if/else it replaces.
    "SIM108",
    # 33 pytest.raises(match=...) patterns contain regex metacharacters. Each
    # needs individual review because escaping changes what the test asserts.
    # Re-enable this rule once those patterns have been audited.
    "RUF043",
]
